{% extends 'base.html' %}
{% block title %}Company Profile{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h3 class="fw-bold mb-4">
                    <i class="bi bi-gear me-2 text-primary"></i>Edit Company Profile
                </h3>
                <form method="POST" action="{{ url_for('company.profile') }}">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Company Name <span class="text-danger">*</span></label>
                            <input type="text" name="company_name" class="form-control" required
                                   value="{{ company.company_name }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">HR Contact</label>
                            <input type="text" name="hr_contact" class="form-control"
                                   value="{{ company.hr_contact or '' }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Website</label>
                            <input type="url" name="website" class="form-control"
                                   value="{{ company.website or '' }}" placeholder="https://...">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Industry</label>
                            <select name="industry" class="form-select">
                                <option value="">Select Industry</option>
                                {% for ind in ['Information Technology', 'Software Development', 'Finance & Banking', 'E-Commerce', 'Consulting', 'Manufacturing', 'Healthcare', 'Education', 'Other'] %}
                                <option {% if company.industry == ind %}selected{% endif %}>{{ ind }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-semibold">Company Description</label>
                            <textarea name="description" class="form-control" rows="4">{{ company.description or '' }}</textarea>
                        </div>
                    </div>
                    <div class="d-flex gap-2 mt-4">
                        <button type="submit" class="btn btn-primary px-4">
                            <i class="bi bi-save me-2"></i>Save Profile
                        </button>
                        <a href="{{ url_for('company.dashboard') }}" class="btn btn-outline-secondary">Back</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
