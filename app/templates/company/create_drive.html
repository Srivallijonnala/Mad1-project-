{% extends 'base.html' %}
{% block title %}Post Placement Drive — Company{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h3 class="fw-bold mb-4">
                    <i class="bi bi-plus-circle me-2 text-success"></i>Post a Placement Drive
                </h3>
                <div class="alert alert-info">
                    <i class="bi bi-info-circle me-2"></i>
                    After submission, the drive will be reviewed and approved by admin before students can see it.
                </div>
                <form method="POST" action="{{ url_for('company.create_drive') }}">
                    <div class="row g-3">
                        <div class="col-12">
                            <label class="form-label fw-semibold">Job Title <span class="text-danger">*</span></label>
                            <input type="text" name="job_title" class="form-control" required
                                   placeholder="e.g. Software Engineer, Data Analyst">
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-semibold">Job Description <span class="text-danger">*</span></label>
                            <textarea name="job_description" class="form-control" rows="4" required
                                      placeholder="Describe the role, responsibilities, and what you're looking for..."></textarea>
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-semibold">Eligibility Criteria</label>
                            <textarea name="eligibility_criteria" class="form-control" rows="2"
                                      placeholder="e.g. B.Tech CS/IT, CGPA >= 7.0, No active backlogs..."></textarea>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Package / CTC</label>
                            <input type="text" name="package" class="form-control"
                                   placeholder="e.g. 6 LPA, 8-12 LPA">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Location</label>
                            <input type="text" name="location" class="form-control"
                                   placeholder="e.g. Bangalore, Remote, Pan India">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Application Deadline <span class="text-danger">*</span></label>
                            <input type="date" name="deadline" class="form-control" required>
                        </div>
                    </div>

                    <div class="d-flex gap-2 mt-4">
                        <button type="submit" class="btn btn-success px-4">
                            <i class="bi bi-send me-2"></i>Submit for Approval
                        </button>
                        <a href="{{ url_for('company.dashboard') }}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
