{% extends 'base.html' %}
{% block title %}Edit Drive — Company{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h3 class="fw-bold mb-4">
                    <i class="bi bi-pencil me-2 text-primary"></i>Edit Placement Drive
                </h3>
                <form method="POST" action="{{ url_for('company.edit_drive', drive_id=drive.id) }}">
                    <div class="row g-3">
                        <div class="col-12">
                            <label class="form-label fw-semibold">Job Title <span class="text-danger">*</span></label>
                            <input type="text" name="job_title" class="form-control" required
                                   value="{{ drive.job_title }}">
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-semibold">Job Description <span class="text-danger">*</span></label>
                            <textarea name="job_description" class="form-control" rows="4" required>{{ drive.job_description }}</textarea>
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-semibold">Eligibility Criteria</label>
                            <textarea name="eligibility_criteria" class="form-control" rows="2">{{ drive.eligibility_criteria or '' }}</textarea>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Package / CTC</label>
                            <input type="text" name="package" class="form-control" value="{{ drive.package or '' }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Location</label>
                            <input type="text" name="location" class="form-control" value="{{ drive.location or '' }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Application Deadline <span class="text-danger">*</span></label>
                            <input type="date" name="deadline" class="form-control" required
                                   value="{{ drive.deadline.strftime('%Y-%m-%d') }}">
                        </div>
                    </div>
                    <div class="alert alert-warning mt-3 mb-0">
                        <i class="bi bi-exclamation-triangle me-2"></i>
                        Editing this drive will reset its status to <strong>Pending</strong> for admin re-approval.
                    </div>
                    <div class="d-flex gap-2 mt-3">
                        <button type="submit" class="btn btn-primary px-4">
                            <i class="bi bi-save me-2"></i>Save Changes
                        </button>
                        <a href="{{ url_for('company.dashboard') }}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
